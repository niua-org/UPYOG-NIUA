serviceMaps:
  serviceName: upyog-data-dx

  mappings:

    # =========================================================
    # PFMS PARENT DATA
    #
    # One object inside data[] = one row in pfms_data
    # =========================================================

    - version: 1.0
      description: Persists PFMS parent data
      fromTopic: state-to-upyog-data-exchange
      isTransaction: true

      queryMaps:

        - query: >
            INSERT INTO public.ug_pfms_data
            (
              id,
              state,
              ward,
              module,
              data_date,
              ulb,
              target_destination
            )
            VALUES
            (
              ?::UUID,
              ?,
              ?,
              ?,
              TO_DATE(?, 'DD-MM-YYYY'),
              ?,
              ?
            );

          basePath: data.*

          jsonMaps:
            - jsonPath: $.data.*.id
            - jsonPath: $.data.*.state
            - jsonPath: $.data.*.ward
            - jsonPath: $.data.*.module
            - jsonPath: $.data.*.date
            - jsonPath: $.data.*.ulb
            - jsonPath: $.data.*.targetDestination


        # =====================================================
        # PFMS TRANSACTIONS
        #
        # One transaction object = one row in pfms_transactions
        # =====================================================

        - query: >
            INSERT INTO public.ug_pfms_transactions
            (
              id,
              correlation_id,
              ulb_code_or_pfms_agency_code,
              voucher_number,
              voucher_date,
              voucher_type,
              financial_year,
              account_head_code,
              function_code,
              scheme_code,
              debit_amount,
              credit_amount,
              narration_or_description,
              voucher_status,
              ulb_bank_account_number,
              ulb_ifsc_code,
              instrument_reference,
              mode_of_transaction,
              beneficiary_or_payee_name,
              beneficiary_account_number,
              beneficiary_ifsc_code,
              beneficiary_type,
              challan_number,
              from_account,
              to_account,
              contra_nature,
              transfer_instruction_reference,
              reference_voucher_number,
              adjustment_type,
              related_asset_or_liability_code,
              debtor_or_creditor_reference,
              basis_of_adjustment,
              period_covered,
              status,
              ingestion_date
            )
            VALUES
            (
              ?::UUID,
              ?::UUID,
              ?,
              ?,
              TO_DATE(?, 'DD/MM/YYYY'),
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?
            );

          basePath: data.*.transactions.*

          jsonMaps:
            - jsonPath: $.data.*.transactions.*.id
            - jsonPath: $.data.*.transactions.*.correlationId
            - jsonPath: $.data.*.transactions.*.ulbCodeOrPFMSAgencyCode
            - jsonPath: $.data.*.transactions.*.voucherNumber
            - jsonPath: $.data.*.transactions.*.voucherDate
            - jsonPath: $.data.*.transactions.*.voucherType
            - jsonPath: $.data.*.transactions.*.financialYear
            - jsonPath: $.data.*.transactions.*.accountHeadCode
            - jsonPath: $.data.*.transactions.*.functionCode
            - jsonPath: $.data.*.transactions.*.schemeCode
            - jsonPath: $.data.*.transactions.*.debitAmount
            - jsonPath: $.data.*.transactions.*.creditAmount
            - jsonPath: $.data.*.transactions.*.narrationOrDescription
            - jsonPath: $.data.*.transactions.*.voucherStatus
            - jsonPath: $.data.*.transactions.*.ulbBankAccountNumber
            - jsonPath: $.data.*.transactions.*.ulbIFSCCode
            - jsonPath: $.data.*.transactions.*.instrumentReference
            - jsonPath: $.data.*.transactions.*.modeOfTransaction
            - jsonPath: $.data.*.transactions.*.beneficiaryOrPayeeName
            - jsonPath: $.data.*.transactions.*.beneficiaryAccountNumber
            - jsonPath: $.data.*.transactions.*.beneficiaryIFSCCode
            - jsonPath: $.data.*.transactions.*.beneficiaryType
            - jsonPath: $.data.*.transactions.*.challanNumber
            - jsonPath: $.data.*.transactions.*.fromAccount
            - jsonPath: $.data.*.transactions.*.toAccount
            - jsonPath: $.data.*.transactions.*.contraNature
            - jsonPath: $.data.*.transactions.*.transferInstructionReference
            - jsonPath: $.data.*.transactions.*.referenceVoucherNumber
            - jsonPath: $.data.*.transactions.*.adjustmentType
            - jsonPath: $.data.*.transactions.*.relatedAssetOrLiabilityCode
            - jsonPath: $.data.*.transactions.*.debtorOrCreditorReference
            - jsonPath: $.data.*.transactions.*.basisOfAdjustment
            - jsonPath: $.data.*.transactions.*.periodCovered
            - jsonPath: $.data.*.transactions.*.status
            - jsonPath: $.data.*.transactions.*.ingestionDate




    # =====================================================
    # PFMS SCHEDULER LOG
    #
    # One scheduler cycle = one row in ug_pfms_scheduler_log
    # =====================================================

    - version: 1.0
      description: Persists PFMS scheduler log
      fromTopic: pfms-scheduler-log
      isTransaction: true

      queryMaps:
        - query: >
            INSERT INTO public.ug_pfms_scheduler_log
            (
              scheduler_type,
              started_at,
              ended_at,
              duration_ms,
              status,
              total_picked,
              success_count,
              failed_count,
              created_by,
              last_modified_time
            )
            VALUES
            (
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?,
              ?
            );

          basePath: @
          jsonMaps:
            - jsonPath: $.schedulerType
            - jsonPath: $.startedAt
            - jsonPath: $.endedAt
            - jsonPath: $.durationMs
            - jsonPath: $.status
            - jsonPath: $.totalPicked
            - jsonPath: $.successCount
            - jsonPath: $.failedCount
            - jsonPath: $.createdBy
            - jsonPath: $.startedAt
