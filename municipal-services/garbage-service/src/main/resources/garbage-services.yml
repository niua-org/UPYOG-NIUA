serviceMaps:
  serviceName: garbage-services
  mappings:
    - version: 1.0
      description: Persists garbage application into consolidated schema (ug_gc_application, ug_gc_specification, ug_gc_document)
      fromTopic: save-garbage-application
      isTransaction: true
      queryMaps:
        - query: >
            INSERT INTO ug_gc_application
            (
              id,
              uuid,
              owner_uuid,
              tenant_uuid,
              application_no,
              parent_application_no,
              old_garbage_no,
              garbage_no,
              property_id,
              floor_no,
              status,
              connection_status,
              arrears,
              tenant,
              business_service,
              channel,
              due_date,
              payment_status,
              payment_amount,
              approval_date,
              additional_detail,
              created_by,
              created_time,
              last_modified_by,
              last_modified_time
            )
            VALUES
            (
              ?,?,?,?,?,?,?,?,?,?,
              ?,?,?,?,?,?,?,?,?,?,
              ?::JSONB,?,?,?,?
            );
          basePath: $.garbageApplications.*
          jsonMaps:
            - jsonPath: $.garbageApplications.*.id
            - jsonPath: $.garbageApplications.*.uuid
            - jsonPath: $.garbageApplications.*.ownerUuid
            - jsonPath: $.garbageApplications.*.tenantUuid
            - jsonPath: $.garbageApplications.*.applicationNo
            - jsonPath: $.garbageApplications.*.parentApplicationNo
            - jsonPath: $.garbageApplications.*.oldGarbageNo
            - jsonPath: $.garbageApplications.*.garbageNo
            - jsonPath: $.garbageApplications.*.propertyId
            - jsonPath: $.garbageApplications.*.floorNo
            - jsonPath: $.garbageApplications.*.status
            - jsonPath: $.garbageApplications.*.connectionStatus
            - jsonPath: $.garbageApplications.*.arrears
            - jsonPath: $.garbageApplications.*.tenantId
            - jsonPath: $.garbageApplications.*.businessService
            - jsonPath: $.garbageApplications.*.channel
            - jsonPath: $.garbageApplications.*.dueDate
            - jsonPath: $.garbageApplications.*.paymentStatus
            - jsonPath: $.garbageApplications.*.paymentAmount
            - jsonPath: $.garbageApplications.*.approvalDate
            - jsonPath: $.garbageApplications.*.additionalDetail
              type: JSON
              dbType: JSONB
            - jsonPath: $.garbageApplications.*.auditDetails.createdBy
            - jsonPath: $.garbageApplications.*.auditDetails.createdTime
            - jsonPath: $.garbageApplications.*.auditDetails.lastModifiedBy
            - jsonPath: $.garbageApplications.*.auditDetails.lastModifiedTime

        - query: >
            INSERT INTO ug_gc_specification
            (
              id,
              garbage_id,
              old_garbage_no,
              collection_type,
              property_type,
              sub_category,
              sub_category_type,
              category,
              no_of_units,
              special_category,
              floor_no,
              is_inheritance,
              created_by,
              created_time,
              last_modified_by,
              last_modified_time
            )
            VALUES
            (
              ?,?,?,?,?,?,?,?,?,?,
              ?,?,?,?,?,?
            );
          basePath: $.garbageApplications.*.garbageSpecification
          jsonMaps:
            - jsonPath: $.garbageApplications.*.garbageSpecification.id
            - jsonPath: $.garbageApplications.*.garbageSpecification.garbageId
            - jsonPath: $.garbageApplications.*.garbageSpecification.oldGarbageNo
            - jsonPath: $.garbageApplications.*.garbageSpecification.collectionType
            - jsonPath: $.garbageApplications.*.garbageSpecification.propertyType
            - jsonPath: $.garbageApplications.*.garbageSpecification.subCategory
            - jsonPath: $.garbageApplications.*.garbageSpecification.subCategoryType
            - jsonPath: $.garbageApplications.*.garbageSpecification.category
            - jsonPath: $.garbageApplications.*.garbageSpecification.no_of_units
            - jsonPath: $.garbageApplications.*.garbageSpecification.specialCategory
            - jsonPath: $.garbageApplications.*.garbageSpecification.floorNo
            - jsonPath: $.garbageApplications.*.garbageSpecification.isInheritance
            - jsonPath: $.garbageApplications.*.garbageSpecification.auditDetails.createdBy
            - jsonPath: $.garbageApplications.*.garbageSpecification.auditDetails.createdTime
            - jsonPath: $.garbageApplications.*.garbageSpecification.auditDetails.lastModifiedBy
            - jsonPath: $.garbageApplications.*.garbageSpecification.auditDetails.lastModifiedTime

        - query: >
            INSERT INTO ug_gc_document
            (
              document_detail_id,
              garbage_id,
              document_type,
              file_store_id,
              created_by,
              created_time,
              last_modified_by,
              last_modified_time
            )
            VALUES
            (
              ?,?,?,?,?,?,?,?
            );
          basePath: $.garbageApplications.*.documents.*
          jsonMaps:
            - jsonPath: $.garbageApplications.*.documents.*.documentDetailId
            - jsonPath: $.garbageApplications.*.documents.*.garbageId
            - jsonPath: $.garbageApplications.*.documents.*.documentType
            - jsonPath: $.garbageApplications.*.documents.*.fileStoreId
            - jsonPath: $.garbageApplications.*.documents.*.auditDetails.createdBy
            - jsonPath: $.garbageApplications.*.documents.*.auditDetails.createdTime
            - jsonPath: $.garbageApplications.*.documents.*.auditDetails.lastModifiedBy
            - jsonPath: $.garbageApplications.*.documents.*.auditDetails.lastModifiedTime

    - version: 1.0
      description: Updates garbage application status, payment, and audit details
      fromTopic: update-garbage-application
      isTransaction: true
      queryMaps:
        - query: >
            UPDATE ug_gc_application
            SET
              status = ?,
              connection_status = ?,
              arrears = ?,
              payment_status = ?,
              payment_amount = ?,
              due_date = ?,
              approval_date = ?,
              additional_detail = ?::JSONB,
              last_modified_by = ?,
              last_modified_time = ?
            WHERE application_no = ?;
          basePath: $.garbageApplications.*
          jsonMaps:
            - jsonPath: $.garbageApplications.*.status
            - jsonPath: $.garbageApplications.*.connectionStatus
            - jsonPath: $.garbageApplications.*.arrears
            - jsonPath: $.garbageApplications.*.paymentStatus
            - jsonPath: $.garbageApplications.*.paymentAmount
            - jsonPath: $.garbageApplications.*.dueDate
            - jsonPath: $.garbageApplications.*.approvalDate
            - jsonPath: $.garbageApplications.*.additionalDetail
              type: JSON
              dbType: JSONB
            - jsonPath: $.garbageApplications.*.auditDetails.lastModifiedBy
            - jsonPath: $.garbageApplications.*.auditDetails.lastModifiedTime
            - jsonPath: $.garbageApplications.*.applicationNo

    - version: 1.0
      description: Persists Disconnection / Reconnection connection log into ug_gc_connection_log and targets
      fromTopic: save-garbage-connection-log
      isTransaction: true
      queryMaps:
        - query: >
            INSERT INTO ug_gc_connection_log
            (
              id,
              garbage_id,
              application_no,
              request_no,
              request_type,
              scope,
              property_id,
              workflow_status,
              requested_by_uuid,
              approved_by_uuid,
              approved_time,
              rejection_reason,
              request_snapshot,
              status,
              reason,
              reason_details,
              effective_from,
              effective_to,
              fee_charged,
              created_by,
              created_time,
              last_modified_by,
              last_modified_time
            )
            VALUES
            (
              ?,?,?,?,?,?,?,?,?,?,
              ?,?,?::JSONB,?,?,?,?,?,?,?,
              ?,?,?
            );
          basePath: $
          jsonMaps:
            - jsonPath: $.id
            - jsonPath: $.garbageId
            - jsonPath: $.applicationNo
            - jsonPath: $.requestNo
            - jsonPath: $.requestType
            - jsonPath: $.scope
            - jsonPath: $.propertyId
            - jsonPath: $.workflowStatus
            - jsonPath: $.requestedByUuid
            - jsonPath: $.approvedByUuid
            - jsonPath: $.approvedTime
            - jsonPath: $.rejectionReason
            - jsonPath: $.requestSnapshot
              type: JSON
              dbType: JSONB
            - jsonPath: $.status
            - jsonPath: $.reason
            - jsonPath: $.reasonDetails
            - jsonPath: $.effectiveFrom
            - jsonPath: $.effectiveTo
            - jsonPath: $.feeCharged
            - jsonPath: $.auditDetails.createdBy
            - jsonPath: $.auditDetails.createdTime
            - jsonPath: $.auditDetails.lastModifiedBy
            - jsonPath: $.auditDetails.lastModifiedTime

        - query: >
            INSERT INTO ug_gc_connection_log_target
            (
              id,
              connection_log_id,
              garbage_id,
              application_no,
              prev_connection_status,
              created_time
            )
            VALUES (?,?,?,?,?,?);
          basePath: $.targets.*
          jsonMaps:
            - jsonPath: $.targets.*.id
            - jsonPath: $.targets.*.connectionLogId
            - jsonPath: $.targets.*.garbageId
            - jsonPath: $.targets.*.applicationNo
            - jsonPath: $.targets.*.prevConnectionStatus
            - jsonPath: $.targets.*.createdTime

    - version: 1.0
      description: Persists monthly rent and bill payments into ug_gc_monthly_rent_payment
      fromTopic: save-garbage-monthly-bill
      isTransaction: true
      queryMaps:
        - query: >
            INSERT INTO ug_gc_monthly_rent_payment
            (
              id,
              garbage_id,
              application_no,
              bill_no,
              demand_id,
              bill_date,
              period_from,
              period_to,
              bill_amount,
              payment_status,
              tenant,
              created_by,
              created_time,
              last_modified_by,
              last_modified_time
            )
            VALUES
            (
              ?,?,?,?,?,?,?,?,?,?,
              ?,?,?,?,?
            );
          basePath: $
          jsonMaps:
            - jsonPath: $.id
            - jsonPath: $.garbageId
            - jsonPath: $.applicationNo
            - jsonPath: $.billNo
            - jsonPath: $.demandId
            - jsonPath: $.billDate
            - jsonPath: $.periodFrom
            - jsonPath: $.periodTo
            - jsonPath: $.billAmount
            - jsonPath: $.paymentStatus
            - jsonPath: $.tenant
            - jsonPath: $.auditDetails.createdBy
            - jsonPath: $.auditDetails.createdTime
            - jsonPath: $.auditDetails.lastModifiedBy
            - jsonPath: $.auditDetails.lastModifiedTime

    - version: 1.0
      description: Persists scheduler execution log into ug_gc_bill_generate
      fromTopic: save-garbage-scheduler-log
      isTransaction: true
      queryMaps:
        - query: >
            INSERT INTO ug_gc_bill_generate
            (
              id,
              garbage_id,
              tenant_id,
              billing_date,
              billing_period_from,
              billing_period_to,
              amount,
              penalty_amount,
              payment_type,
              status,
              created_by,
              created_time,
              last_modified_by,
              last_modified_time
            )
            VALUES
            (
              ?,?,?,?,?,?,?,?,?,?,
              ?,?,?,?
            );
          basePath: $
          jsonMaps:
            - jsonPath: $.id
            - jsonPath: $.garbageId
            - jsonPath: $.tenantId
            - jsonPath: $.billingDate
            - jsonPath: $.billingPeriodFrom
            - jsonPath: $.billingPeriodTo
            - jsonPath: $.amount
            - jsonPath: $.penaltyAmount
            - jsonPath: $.paymentType
            - jsonPath: $.status
            - jsonPath: $.auditDetails.createdBy
            - jsonPath: $.auditDetails.createdTime
            - jsonPath: $.auditDetails.lastModifiedBy
            - jsonPath: $.auditDetails.lastModifiedTime
