spring.main.allow-bean-definition-overriding=true
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers:localhost:9092}
reconciliation.data-source.type=ELASTICSEARCH
reconciliation.kafka.create.topic=save-reconciliation-details
reconciliation.job.cron=0 0 10 * * ?
egov.indexer.host=http://localhost:9200
state.extractor.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
