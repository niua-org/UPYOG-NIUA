# ============================================================
# Chat Memory & Retention Policy
# ============================================================
memory:
  # Number of days to retain long-term chat history in Qdrant before cleanup
  retention_days: 90

# ============================================================
# System Messages & Intent Responses Configuration
# ============================================================
system_messages:
  greeting:
    keywords: ["hello", "hi", "hey", "namaste", "good morning", "good afternoon", "good evening", "hola", "howdy", "greetings", "नमस्ते", "हेलो"]
    response_en: "Hello! I'm UPYOG AI. How can I help you today?"
    response_hi: "नमस्ते! मैं UPYOG AI हूँ। मैं आपकी क्या सहायता कर सकता हूँ?"
  blocked:
    response_en: "I can only assist with UPYOG and its services (such as Property Tax, Trade License, Water & Sewerage, Grievances, and Advertisement Bookings). Please ask a question related to municipal services."
    response_hi: "मैं केवल UPYOG और शहरी नगरपालिका नागरिक सेवाओं (जैसे संपत्ति कर, व्यापार लाइसेंस, जल और सीवरेज, शिकायत निवारण, और विज्ञापन बुकिंग) में सहायता कर सकता हूँ। कृपया नगर सेवाओं से संबंधित प्रश्न पूछें।"
  login:
    keywords_query: ["how to login", "how do i login", "login kaise kare", "login help", "लॉगिन कैसे करें"]
    keywords_claim: ["login done", "logged in", "login ho gaya", "maine login kar liya", "लॉगिन हो गया"]
    guidance_en: "In the left sidebar, scroll down and click on **Login**. Enter your registered mobile number and then enter the OTP received on your phone. Once logged in, you will be able to create bookings, register complaints, and check your application status."
    guidance_hi: "बाईं ओर के साइडबार (Left Sidebar) में नीचे जाएं और **Login** विकल्प पर क्लिक करें। अपना पंजीकृत मोबाइल नंबर भरें और फिर प्राप्त OTP दर्ज करें। लॉगिन करने के बाद, आप बुकिंग बना सकते हैं, शिकायत दर्ज कर सकते हैं और अपने आवेदन की स्थिति देख सकते हैं।"
    verified_en: "Great! Your login session is verified ({name}). You can now proceed to book an advertisement or register a complaint. How would you like to proceed?"
    verified_hi: "बहुत बढ़िया! आपकी पहचान सत्यापित हो गई है ({name})। अब आप विज्ञापन बुकिंग कर सकते हैं या शिकायत दर्ज कर सकते हैं। आप क्या करना चाहते हैं?"
    unverified_en: "I do not detect an active logged-in session yet. Please complete the login by clicking **Login** in the left sidebar and entering your mobile number and OTP."
    unverified_hi: "मुझे अभी आपका सक्रिय लॉगिन सत्र नहीं मिला है। कृपया बाईं ओर के साइडबार में नीचे **Login** विकल्प पर क्लिक करके अपने मोबाइल नंबर और OTP से लॉगिन पूरा करें।"
  applicant_profile:
    prompt_en: "I can use your registered profile details for this advertisement booking:\n\n• **Name**: {name}\n• **Mobile Number**: {mobile}\n• **Email Address**: {email}\n\nWould you like to proceed with these profile details or edit them?"
    prompt_hi: "मैं इस विज्ञापन बुकिंग के लिए आपके पंजीकृत प्रोफ़ाइल विवरण का उपयोग कर सकता हूँ:\n\n• **नाम**: {name}\n• **मोबाइल नंबर**: {mobile}\n• **ईमेल**: {email}\n\nक्या आप इन प्रोफ़ाइल विवरणों के साथ आगे बढ़ना चाहते हैं या इनमें बदलाव करना चाहते हैं?"
    options_en: ["Use Profile Details", "Edit Details"]
    options_hi: ["प्रोफ़ाइल विवरण का उपयोग करें", "विवरण बदलें"]
    edit_prompt_en: "Which detail would you like to change?"
    edit_prompt_hi: "आप कौन सा विवरण बदलना चाहते हैं?"
    edit_options_en:
      "Name": "applicantName"
      "Mobile Number": "mobileNumber"
      "Email Address": "emailId"
    edit_options_hi:
      "नाम": "applicantName"
      "मोबाइल नंबर": "mobileNumber"
      "ईमेल आईडी": "emailId"
  faq_question:
    question_starters: [
      "what", "how", "why", "when", "where", "who", "which", "whose", "whom",
      "can i", "could you", "tell me", "explain", "meaning",
      "kya", "kaise", "kab", "kahan", "kyun", "kis", "batao", "bataiye"
    ]
  # Workflow intents that trigger or drive transactional form execution.
  # NOTE: Cancellation intents (adv_cancel, grievance_cancel, booking_cancel) are
  # intentionally excluded here because they represent dialogue abort/exit signals,
  # not workflow execution triggers. They are intercepted by dedicated cancel handlers.
  workflow_intents: [
    "grievance_candidate", "grievance_status_candidate", "grievance_confirm",
    "adv_candidate", "adv_status_candidate", "booking_candidate", "adv_confirm", "booking_confirm"
  ]
  goodbye_keywords: [
    "bye", "goodbye", "exit", "quit", "tata", "alvida", "see you", "done for now", "band karo"
  ]
  cancellation:
    adv_booking:
      en: "Your Advertisement Booking application has been cancelled. No submission was made to the portal.\n\nHow else can I assist you today?"
      hi: "आपकी विज्ञापन बुकिंग रद्द कर दी गई है। पोर्टल पर कोई आवेदन दर्ज नहीं किया गया है।\n\nमैं आपकी और क्या सहायता कर सकता हूँ?"
    grievance:
      en: "Your Grievance application has been cancelled. No submission was made to the portal.\n\nHow else can I assist you today?"
      hi: "आपकी शिकायत दर्ज करने की प्रक्रिया रद्द कर दी गई है। पोर्टल पर कोई आवेदन दर्ज नहीं किया गया है।\n\nमैं आपकी और क्या सहायता कर सकता हूँ?"
    general:
      en: "Understood. The request has been cancelled. How else can I assist you today?"
      hi: "ठीक है, अनुरोध रद्द कर दिया गया है। मैं आपकी और क्या सहायता कर सकता हूँ?"

  workflow_templates:
    intro_with_extracted:
      en: "I have noted your preferences for {service_name}:\n{extracted_details}\n\nTo proceed, here are the steps involved in the application process:\n{stages}\n\nShall we proceed with your application?"
      hi: "आपकी {service_name} के लिए निम्नलिखित विवरण नोट कर लिए गए हैं:\n{extracted_details}\n\nआगे बढ़ने के लिए, आवेदन प्रक्रिया के चरण इस प्रकार हैं:\n{stages}\n\nक्या हम आपके आवेदन के साथ आगे बढ़ें?"
    intro_generic:
      en: "To proceed with your {service_name}, here are the steps involved in the application process:\n{stages}\n\nShall we proceed with your application?"
      hi: "आपकी {service_name} प्रक्रिया के लिए, आवेदन प्रक्रिया के चरण इस प्रकार हैं:\n{stages}\n\nक्या हम आपके आवेदन के साथ आगे बढ़ें?"
    consent_options:
      en: ["Yes, proceed", "No, cancel"]
      hi: ["हाँ, आगे बढ़ें", "नहीं, रद्द करें"]
    initiation_triggers:
      en: ["help", "book", "file", "register", "start", "new", "apply", "create", "lodge", "raise"]
      hi: ["मदद", "सहायता", "बुक", "दर्ज", "शिकायत", "आवेदन", "शुरू", "नया", "नई", "karna", "darj"]

  workflow_intros:
    grievance:
      stages_en: "• **Complaint Details**: Selection of grievance category, complaint type, and problem description.\n• **Location Information**: Specification of the affected locality or area.\n• **Review & Submission**: Verification of complaint details prior to generating your service ticket."
      stages_hi: "• **शिकायत का विवरण**: शिकायत की श्रेणी, प्रकार तथा समस्या का विवरण।\n• **स्थान की जानकारी**: प्रभावित इलाका अथवा संबंधित क्षेत्र का चयन।\n• **समीक्षा एवं सबमिशन**: शिकायत टिकट दर्ज करने से पूर्व सभी विवरणों की समीक्षा।"
    adv_booking:
      stages_en: "• **Advertisement & Slot Details**: Selection of advertisement category, location, dimensions, and booking schedule.\n• **Applicant Information**: Collection of applicant name, contact information, and address.\n• **Review & Confirmation**: Verification of all booking details prior to final submission."
      stages_hi: "• **विज्ञापन एवं स्लॉट विवरण**: विज्ञापन श्रेणी, स्थान, माप तथा बुकिंग समय-सारणी का चयन।\n• **आवेदक का विवरण**: आवेदक का नाम, मोबाइल नंबर एवं पते की जानकारी।\n• **समीक्षा एवं पुष्टि**: आवेदन अंतिम रूप से जमा करने से पूर्व सभी विवरणों की समीक्षा।"


# ============================================================
# Services Registry
# The bot reads this at runtime to build its greeting message.
# Add, remove or rename entries here — no Python code changes needed.
# "key" MUST match the LangGraph plugin filename (e.g. "grievance" -> workflow/grievance.py)
# "key: faq" is always available (built-in RAG path, no plugin file needed)
# ============================================================
services:
  - key: "adv_booking"
    name: "Advertisement Booking"
    description: "book hoarding, unipole, kiosk or banner advertisement space"
    name_hi: "विज्ञापन बुकिंग"
    description_hi: "होर्डिंग, यूनीपोल या बैनर विज्ञापन स्थान बुक करें"
    keywords: ["ad", "ads", "adv", "booking", "advertisement", "hoarding", "unipole", "banner", "kiosk", "billboard"]
    id_prefixes: ["ADV-", "ADV"]

  - key: "grievance"
    name: "Grievance / Complaint"
    description: "file a civic grievance or complaint (water, roads, garbage, etc.)"
    name_hi: "शिकायत दर्ज करें"
    description_hi: "पानी, सड़क, कचरा जैसी नागरिक समस्या की शिकायत दर्ज करें"
    keywords: ["pgr", "complaint", "complaints", "grievance", "shikayat", "complain", "ticket"]
    id_prefixes: ["PGR-"]

  - key: "faq"
    name: "General Questions"
    description: "ask anything about UPYOG services — property tax, water connection, trade license, fire NOC"
    name_hi: "सामान्य प्रश्न"
    description_hi: "संपत्ति कर, जल कनेक्शन, व्यापार लाइसेंस के बारे में प्रश्न पूछें"

upyog:
  # Base URL of the UPYOG environment (can be dynamically overridden per request or via UPYOG_BASE_URL / UPYOG_ENV)
  default_env: "niuatt"
  base_url: "https://niuatt.niua.in"

  # ── Registered Environments ──────────────────────────────
  environments:
    niuatt:
      name: "NIUATT (Testing)"
      base_url: "https://niuatt.niua.in"
      tenant_id: "pg.citya"
      state_tenant: "pg"
      trusted_origins:
        - "https://niuatt.niua.in"
    sandbox:
      name: "UPYOG Sandbox (Testing)"
      base_url: "https://upyog-sandbox.niua.org"
      tenant_id: "pg.citya"
      state_tenant: "pg"
      trusted_origins:
        - "https://upyog-sandbox.niua.org"
    production:
      name: "UPYOG Production"
      base_url: "https://upyog.niua.org"
      tenant_id: "pg.citya"
      state_tenant: "pg"
      trusted_origins:
        - "https://upyog.niua.org"
    local:
      name: "Localhost Development"
      base_url: "http://localhost:8080"
      tenant_id: "pg.citya"
      state_tenant: "pg"
      trusted_origins:
        - "http://localhost:3000"
        - "http://localhost:8080"
        - "http://127.0.0.1:3000"
        - "http://127.0.0.1:8080"

  # Tenant ID for MDMS and advertisement services (default fallback)
  tenant_id: "pg.citya"

  # State-level Tenant (used for fetching configs, uploading files, and sending OTP) (default fallback)
  state_tenant: "pg"

  # ── OAuth / Authentication ──────────────────────────────
  auth:
    # OAuth endpoint path (appended to base_url)
    token_path: "/user/oauth/token"

    # Master system credentials (username/password come from .env as UPYOG_USERNAME / UPYOG_PASSWORD)
    # tenant and grant type are not secret — kept here
    tenant_id: "pg"
    user_type: "CITIZEN"
    scope: "read"
    grant_type: "password"

    # Token refresh buffer in seconds (refresh 10 min before expiry)
    refresh_buffer_seconds: 600

  # ── Fallback/Master User Profile ────────────────────────
  # Used when a citizen is not logged in. Not a real user — test/system account.
  master_user:
    id: 893
    uuid: "1d19970b-e1c7-46dd-a554-d2353a2c2965"
    user_name: "9999999999"
    name: "ABC"
    mobile_number: "9999999999"
    email: "abc@gmail.com"
    locale: "en_IN"
    type: "CITIZEN"
    role_name: "Citizen"
    role_code: "CITIZEN"
    tenant_id: "pg"

  # ── API Endpoint Paths ───────────────────────────────────
  endpoints:
    # Advertisement Booking
    search_ads:       "/adv-services/booking/v1/_search"
    slot_search:      "/adv-services/booking/v1/_slot-search"
    create_booking:   "/adv-services/booking/v1/_create"
    fetch_bill:       "/billing-service/bill/v2/_fetchbill"
    mdms_search:      "/egov-mdms-service/v1/_search"
    filestore_upload: "/filestore/v1/files"
    send_otp:         "/user-otp/v1/_send"
    user_search:      "/user/_search"

    # Public Grievance Redressal (PGR)
    pgr_create:       "/pgr-services/v2/request/_create"
    pgr_search:       "/pgr-services/v2/request/_search"
    pgr_mdms:         "/mdms-v2/v1/_search"
    pgr_locality:     "/egov-location/location/v11/boundarys/_search"

  # ── Search / Query Defaults ──────────────────────────────
  search_defaults:
    ads_limit: 4
    ads_sort_order: "DESC"
    ads_sort_by: "createdTime"
    ads_offset: 0
    bill_business_service: "adv-services"

  # ── Booking Defaults ─────────────────────────────────────
  booking_defaults:
    booking_from_time: "06:00"
    booking_to_time:   "05:59"
    booking_status:    "BOOKING_CREATED"
    default_pincode:   "110001"
    default_city:      "City A"
    default_city_code: "1013"
    default_locality:  "Preet Nagar"
    default_locality_code: "JLC478"
    default_street:    "street"
    default_house_no:  "1"
    default_landmark:  "NA"

  # ── MDMS Module Masters ──────────────────────────────────
  mdms:
    advertisement_module: "Advertisement"
    advertisement_masters:
      - "AdType"
      - "Location"
      - "FaceArea"
      - "CalculationType"

  # ── Document Types ───────────────────────────────────────
  document_types:
    sample:   "APPLICANT.ADVERTISEMENT.SAMPLE.DOC"
    address:  "APPLICANT.ADDRESSPROOF.ELECTRICITYBILL"
    identity: "APPLICANT.IDENTITYPROOF.AADHAAR"

  # ── Filestore ────────────────────────────────────────────
  filestore:
    module:   "Advertisement"
    tenant:   "pg"

  # ── Grievance (PGR) Settings ─────────────────────────────
  grievance:
    # MDMS config for fetching complaint categories
    mdms_module:    "RAINMAKER-PGR"
    mdms_master:    "ServiceDefs"

    # Tenant used for PGR API calls
    tenant_id:      "pg.citya"
    state_tenant:   "pg"

    # Location boundary query params (egov-location API)
    hierarchy_type: "ADMIN"
    boundary_type:  "Locality"

    # Complaint creation defaults
    priority:       "HIGH"
    source:         "web"

# ============================================================
# Dynamic Form Schemas
# ============================================================
forms:
  adv_booking:
    name: "Advertisement Booking"
    fields:
      - id: "addType"
        type: "dropdown"
        label: "Advertisement Type"
        mdms: ["Advertisement", "AdType"]
        extractable: true
        validation:
          required: true

      - id: "location"
        type: "dropdown"
        label: "Advertisement Location"
        mdms: ["Advertisement", "Location"]
        extractable: true
        validation:
          required: true

      - id: "faceArea"
        type: "dropdown"
        label: "Face Area"
        mdms: ["Advertisement", "FaceArea"]
        extractable: true
        validation:
          required: true

      - id: "start_date"
        type: "date"
        label: "Start Date"
        extractable: true
        validation:
          required: true
          after_today: true

      - id: "end_date"
        type: "date"
        label: "End Date"
        extractable: true
        validation:
          required: true
          on_or_after: "start_date"

      - id: "nightLight"
        type: "dropdown"
        label: "Night Light Required"
        mdms: ["Advertisement", "NightLight"]
        extractable: true
        validation:
          required: true

      - id: "selected_slots"
        type: "slots"
        label: "Selected Booking Slot"
        extractable: false
        validation:
          required: true

      - id: "applicantName"
        type: "text"
        label: "Applicant Name"
        extractable: true
        validation:
          required: true
          min_length: 2
          max_length: 50
          pattern: "^[a-zA-Z\\u0900-\\u097F .'-]+$"

      - id: "mobileNumber"
        type: "text"
        label: "Mobile Number"
        extractable: true
        validation:
          required: true
          pattern: "^[6-9][0-9]{9}$"

      - id: "emailId"
        type: "text"
        label: "Email Address"
        extractable: true
        validation:
          required: false
          pattern: "^[a-zA-Z0-9_.+-]+@[a-zA-Z]+(\\.[a-zA-Z]{2,})+$"

      - id: "address"
        type: "text"
        label: "Applicant Address"
        extractable: true
        validation:
          required: true
          min_length: 5

      - id: "doc_sample"
        type: "file"
        label: "Sample Document"
        extractable: false

      - id: "doc_address"
        type: "file"
        label: "Address Proof"
        extractable: false

      - id: "doc_identity"
        type: "file"
        label: "Identity Proof"
        extractable: false

  # ── Grievance / PGR Form ──────────────────────────────────────────────────────
  grievance:
    name: "Complaint Registration"
    fields:
      # Step 1: Main category (fetched live from RAINMAKER-PGR MDMS)
      - id: "category"
        type: "dropdown"
        label: "Grievance Category"
        extractable: true
        validation:
          required: true

      # Step 2: Specific complaint type within the chosen category
      - id: "sub_category"
        type: "dropdown"
        label: "Complaint Type"
        extractable: true
        validation:
          required: true


      # Step 3: Free-text problem description
      - id: "description"
        type: "text"
        label: "Problem Description"
        extractable: true
        validation:
          required: true
          min_length: 10

      # Step 4: Area/locality (fetched live from egov-location API)
      - id: "locality"
        type: "dropdown"
        label: "Your Area / Locality"
        extractable: true
        validation:
          required: true

