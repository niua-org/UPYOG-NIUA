# ==============================================================================
# UPYOG Voice Bot — Canonical Service Synonyms & Alternative Expressions
# ==============================================================================
# Purpose:
#   Provides a single source of truth for recognizing service names, multilingual
#   aliases (English, Hindi Devanagari, and Romanized Hindi/Hinglish), domain-specific
#   colloquialisms, and action triggers across UPYOG municipal urban services.
#
# Consumption:
#   1. services/normalizer.py: Builds fast-path fuzzy lookup and domain vocabulary.
#   2. services/chat_handlers.py: Direct service routing in resolve_active_and_target_plugin.
#   3. prompts/intent_prompts.py: Dynamic prompt injection for LLM intent classification.
#   4. services/rag_service.py: Query expansion for knowledge retrieval (FAQ/FRS).
# ==============================================================================

services:
  # --------------------------------------------------------------------------
  # 1. Advertisement Booking (Transactional LangGraph Workflow)
  # --------------------------------------------------------------------------
  adv_booking:
    canonical_name: "Advertisement Booking"
    service_code: "ADV"
    target_workflow: "adv_booking"
    description: "Booking municipal hoardings, unipoles, kiosks, or banner advertisement spaces"
    id_prefixes: ["ADV-", "ADV"]
    
    # Verbs that signal active intent to initiate a booking vs informational query
    action_triggers:
      en: ["book", "rent", "hire", "apply", "reserve", "put up", "display", "place"]
      hi: ["बुक", "लगाना", "लगवाना", "आरक्षित", "चाहिए"]
      hinglish: ["book karna", "lagwana", "lagana", "chahiye", "book karo", "rent pe"]

    # Multilingual expressions and synonyms
    expressions:
      en:
        - "advertisement"
        - "advertisement booking"
        - "ad booking"
        - "ad space"
        - "hoarding"
        - "hoardings"
        - "billboard"
        - "billboards"
