# Catalog from application.properties / application.yml only.
# healthPath is set only when that file contains a literal health URL.
# management.endpoints.web.base-path is recorded as managementPath and is not called.
# readPath, writePath, authPath, and tenantPath are empty: those APIs were not taken from config.
# versionPath is empty: no version endpoint property was present.
