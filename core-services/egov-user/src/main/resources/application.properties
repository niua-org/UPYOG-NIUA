#Set context root
#server.contextPath=/user
server.servlet.context-path=/user
server.port=8081
app.timezone=UTC

# JWT Token optimization - set to true to reduce token size by excluding roles
jwt.token.optimize-size=true

# Token format - set to "opaque" for UUID-sized tokens, "jwt" for JWT tokens
oauth2.token.format=opaque
security.sessions:NEVER
spring.redis.host=localhost
spring.redis.port=6379
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/upyog
#spring.datasource.url=jdbc:postgresql://prd-erp-db01.postgres.database.azure.com:5432/digit
spring.datasource.username=postgres
spring.datasource.password=postgres
flyway.enabled=true
flyway.user=postgres
flyway.password=postgres
flyway.outOfOrder=true
flyway.table=egov_user_schema_version
flyway.baseline-on-migrate=true
flyway.url=jdbc:postgresql://localhost:5432/devdb
flyway.locations=db/migration/ddl,db/migration/seed,db/migration/dev

flyway.out-of-order=true
flyway.ignore-missing-migrations = true

# The getUniqueUser method depends on a predefined System User.
# Ensure the System User is created via the curl script in the Postman folder,
# otherwise user search will fail.

egov.user.search.default.size=10
egov.otp.host=http://egov-otp:8080/
egov.services.otp.search_otp=otp/v1/_search
egov.services.otp.validate_otp=otp/v1/_validate
egov.services.accesscontrol.host=http://egov-accesscontrol:8080/
#egov.services.accesscontrol.host=https://egov.chandigarhsmartcity.in
egov.services.accesscontrol.action_search=access/v1/actions/_search
egov.filestore.host=http://egov-filestore:8080/
egov.filestore.path=filestore/v1/files/url
# Filestore validation toggle - set to true in production, false for local testing with mock filestore IDs
filestore.validation.enabled=true
mdms.roles.filter=[?(@.code IN [$code])]
mdms.roles.masterName=roles
mdms.roles.moduleName=ACCESSCONTROL-ROLES
mdms.host=http://egov-mdms-service:8080/
#mdms.host=https://upyog-sandbox.niua.org
#mdms.host=https://egov.chandigarhsmartcity.in
mdms.path=egov-mdms-service/v1/_search

# MDMS Address Type Master Data Configuration (UPYOG Standard)
mdms.address.type.enabled=true
mdms.address.type.moduleName=common-masters
mdms.address.type.masterName=AddressType
mdms.address.type.filter=[?(@.active==true)]
address.types.allowed=PERMANENT,CORRESPONDENCE,OFFICE,TEMPORARY,OTHER
# Daily cache refresh duration (24 hours in milliseconds) and cron expression (midnight daily)
address.type.cache.ttl.millis=86400000
address.type.cache.cron=0 0 0 * * *

# Family Service Integration Config
family.service.host=http://upyog-family-service.egov:8080/
family.service.state.jit.endpoint=family/v1/state/_jitProvision

citizen.login.password.otp.enabled=true
employee.login.password.otp.enabled=false
citizen.login.password.otp.fixed.value=123456
citizen.login.password.otp.fixed.enabled=true
citizen.multi.account.selection.enabled=false
otp.validation.register.mandatory=true
access.token.validity.in.minutes=10080
refresh.token.validity.in.minutes=20160
default.password.expiry.in.days=90
mobile.number.validation.workaround.enabled=false
roles.state.level.enabled=true
#user.service.host=https://dev.digit.org
egov.user.host=http://egov-user.egov:8080/
citizen.registration.withlogin.enabled=true
#password-policy
egov.user.name.pattern=^[^\\$\"'<>?\\\\~`!@#$%^()+={}\\[\\]*,.:;\u201C\u201D\u2018\u2019]*$
egov.user.pwd.pattern=((?=.*\\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%])(?=\\S+$).*$)
egov.user.pwd.pattern.min.length=8
egov.user.pwd.pattern.max.length=15
logging.pattern.console=%clr(%X{CORRELATION_ID:-}) %clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}
egov.mdms.actions=actions-test
tracer.detailed.tracing.enabled=true
tracer.errors.sendToKafka=false
account.unlock.cool.down.period.minutes=60
max.invalid.login.attempts.period.minutes=30
max.invalid.login.attempts=5
create.user.validate.name=true

#------------requester-services-dx config----------------#
requester.service.host=https://upyog.niua.org/
requester.service.endpoint=requester-services-dx/digilocker/details
requester.aadhaar.verify.endpoint=requester-services-dx/aadhaar/v1/_verifyOtp
fixed.otp.enabled=false
fixed.otp.password=123456
#------------egov-enc-service config----------------#
egov.enc.host=http://egov-enc-service.egov:8080/
egov.enc.encrypt.endpoint=egov-enc-service/crypto/v1/_encrypt
egov.enc.decrypt.endpoint=egov-enc-service/crypto/v1/_decrypt
#----------------MDMS config---------------------#
#egov.mdms.host=https://upyog-sandbox.niua.org/
egov.mdms.host=http://egov-mdms-service:8080/
#egov.mdms.host=https://egov.chandigarhsmartcity.in
egov.mdms.search.endpoint=egov-mdms-service/v1/_search
state.level.tenant.id=pg
#-----------Kafka Audit Topic Name------------#
kafka.topic.audit=audit_data

kafka.topics.notification.mail.name=egov.core.notification.email
kafka.topics.notification.sms.topic.name=egov.core.notification.sms

#------------Kafka Config----------------------#
kafka.config.bootstrap_server_config=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.retries=10

#--------enable/disable ABAC in encryption----------#
decryption.abac.enabled=true

#-------------egov-localization-service-------------#
egov.localization.host=http://egov-localization:8080
egov.localization.search.endpoint=/localization/messages/v1/_search
egov.localization.module=egov-user
egov.localization.default.locale=en_IN

key.generator.hash.algorithm=MD5
digilocker.register=true
digilocker.search=true

spring.main.allow-bean-definition-overriding=true
user.address.update.strategy=true
# Configuration to enable/disable mandatory address fields validation
user.address.mandatory.fields.enabled=true

# SpringDoc OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.enabled=true

# Maximum invalid OTP attempts permitted before transaction reference lockout
aadhaar.otp.max.attempts=3
otp.max.invalid.attempts=3
