# Server Configuration
server.port=8092
server.servlet.context-path=/family

# Spring Datasource Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/niuatt
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:/db/migration/ddl
spring.flyway.baseline-on-migrate=true
spring.flyway.table=ug_family_schema_version
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false

# Tracer & Telemetry
tracer.opentracing.enabled=false

# Springdoc OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Kafka Configuration (Persister & Asynchronous Events)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# UPYOG External Service Integration Hosts & Endpoints
egov.idgen.host=http://localhost:8086
egov.idgen.path=/egov-idgen/id/_generate
egov.idgen.family.id.name=family.id
egov.idgen.family.id.format=FAM-[cy:yyyy]-[seq_family_id]

egov.user.host=http://localhost:8081
egov.user.search.path=/user/_search

egov.filestore.host=http://localhost:8083
egov.filestore.url.path=/filestore/v1/files/url

egov.mdms.host=http://localhost:8084
egov.mdms.search.path=/egov-mdms-service/v1/_search

requester.services.dx.host=http://localhost:8280
requester.services.dx.verify.otp.path=/requester-services-dx/v1/_verifyOtp

# MDMS Relationship Master Data Configuration
family.mdms.module=common-masters
family.mdms.relationship.master=FamilyRelationship
family.mdms.relationship.filter=[?(@.active==true)]
family.relationship.cache.ttl=86400000

# Family Kafka Event Topics
family.kafka.create.topic=save-ug-family
family.kafka.update.topic=update-ug-family
family.kafka.split.topic=split-ug-family
family.kafka.merge.topic=merge-ug-family
family.kafka.add.member.topic=add-ug-family-member
family.kafka.leave.family.topic=leave-ug-family-member
family.kafka.assign.hof.topic=assign-ug-family-hof

# Pagination Configuration
family.default.offset=0
family.default.limit=10
family.max.limit=100
